<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>古文現場重現｜手機試玩版</title><style>
:root{--ink:#302c2a;--muted:#736a61;--paper:#fffdf8;--bg:#f3eee6;--brown:#8b5940;--line:#d8c8b6;--green:#397450}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3874b4;outline-offset:3px}.app{max-width:900px;margin:auto;padding:14px 14px 40px}header{text-align:center;padding:8px 0 12px}.eyebrow{font-size:13px;color:var(--brown);letter-spacing:2px;font-weight:700}h1{font-size:clamp(22px,4vw,30px);margin:5px 0}header p{margin:4px;color:var(--muted);font-size:13px}.topline{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700;margin:8px 0}.progress{height:8px;border-radius:12px;background:#dfd3c6;overflow:hidden}.progress>div{height:100%;background:#709c7c;transition:width .3s}.card,.library,.review{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 14px #4e33200b}.card{margin-top:12px}.tag{font-size:13px;color:var(--brown);font-weight:800}.sentence{font-size:22px;line-height:1.7;letter-spacing:.025em;margin:9px 0 14px;font-weight:650}.target{height:148px;border:2px dashed #b88768;background:#f9f1e7;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#92725e}.target .plus{font-size:36px;line-height:1}.target.filled{border-style:solid;background:#fff}.target.filled img{height:100%;max-width:100%;object-fit:contain;border-radius:8px}.library{margin-top:12px}.library-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.library h2,.review h2{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin:5px 0 12px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice{padding:3px;background:white;border:2px solid #e0d4c7;border-radius:9px;aspect-ratio:1;overflow:hidden;min-width:0}.choice img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}.choice:active{transform:scale(.96)}.feedback{font-size:14px;font-weight:700;min-height:22px;margin:12px 0 0}.feedback.good{color:var(--green)}.feedback.bad{color:#b44937}.controls{display:flex;gap:9px;margin-top:14px}.controls button,.modal-actions button,.next{border:0;border-radius:10px;padding:11px 14px;font-weight:750}.controls button{background:#e8ddd0;color:#4a3a30}.overlay{position:fixed;inset:0;background:#1d1919b9;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(100%,440px);background:#fffdf8;border-radius:18px;padding:16px;box-shadow:0 12px 55px #0004}.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modal-top strong{font-size:18px}.close{border:0;background:#eee6dc;border-radius:50%;width:34px;height:34px;font-size:23px}.preview{display:block;width:min(100%,min(56vh,370px));aspect-ratio:1;object-fit:contain;margin:auto;border-radius:10px;background:#f2e9de}.modal-actions{display:flex;gap:9px;margin-top:14px}.modal-actions button{flex:1}.cancel{background:#eee6dc;color:#51443a}.confirm,.next{background:#8b5940;color:#fff}.review{margin-top:14px;display:none}.review.show{display:block}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.review-item{border:1px solid var(--line);border-radius:12px;padding:9px;background:white}.review-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.review-item p{font-size:16px;line-height:1.65;margin:8px 0 0}.review-item small{color:var(--brown)}.next{width:100%;margin-top:5px}.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}@media(min-width:680px){.app{padding:22px}.play-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}.card,.library{margin-top:16px}.choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.target{height:230px}.review-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:1000px){.app{max-width:1120px}.choices{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:360px){.app{padding:10px}.card,.library{padding:11px}.choices{gap:5px}.sentence{font-size:21px}}

/* V2.1 手機優先：精簡待填提示、候選插畫採田字形排列 */
@media (max-width:679px){
  .app{padding:10px 12px 28px}
  header{padding:3px 0 8px}
  .card,.library{padding:12px;margin-top:10px}
  .sentence{font-size:22px;line-height:1.65;margin:10px 0 12px}
  .target{height:auto;min-height:48px;padding:9px 12px;flex-direction:row;gap:8px;font-size:15px}
  .target .plus{font-size:22px;line-height:1}
  .target.filled{height:auto;min-height:48px;max-height:220px;padding:8px}
  .target.filled img{max-height:200px;width:auto;max-width:100%;object-fit:contain}
  .feedback{min-height:0;margin:7px 0 0}
  .feedback:empty{display:none}
  .choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .choice{padding:4px;border-radius:12px}
  .choice img{border-radius:8px}
  .sub{margin:4px 0 10px}
  .controls{margin-top:12px}
  .note{margin-top:10px}
}
@media (min-width:680px){
  .target{height:auto;min-height:62px;padding:10px;flex-direction:row;font-size:16px}
  .target .plus{font-size:24px}
  .target.filled{height:220px}
  .choices{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:1000px){.choices{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style></head><body><main class="app"><header><div class="eyebrow">古文現場重現 · 手機試玩版 V2.1</div><h1>《左忠毅公軼事》</h1><p>閱讀原文，選出最符合情節的插畫</p></header><div id="game"><div class="topline"><span id="progressLabel">第 1 / 4 句</span><span id="score">得分 0</span></div><div class="progress"><div id="progressFill"></div></div><div class="play-area"><section class="card"><div class="tag" id="chapterLabel">第一章・情節配對</div><p class="sentence" id="sentence"></p><div class="target" id="target"><span class="plus">＋</span><span>選擇下方插畫填入</span></div><div id="feedback" class="feedback" aria-live="polite"></div></section><section class="library"><div class="library-head"><h2>候選插畫</h2><span id="remaining" class="tag"></span></div><p class="sub">點選縮圖 → 放大觀看 → 確認作答</p><div class="choices" id="choices"></div><div class="controls"><button id="reset">重新開始</button><button id="sound">音效：開</button></div></section></div></div><section id="review" class="review"><h2>🎉 完成四句試玩！漫畫回顧</h2><p class="sub">正式版將每7句進入一次回顧；目前先用4句測試。</p><div class="review-grid" id="reviewGrid"></div><button class="next" id="again">再玩一次</button></section><p class="note">手機田字形2×2大圖庫｜電腦4～6欄自適應｜所有插畫保留原始正方形</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="放大預覽候選圖片"><div class="modal"><div class="modal-top"><strong>仔細觀察這張插畫</strong><button class="close" id="close" aria-label="關閉預覽">×</button></div><img id="preview" class="preview" alt="候選插畫放大預覽"><div class="modal-actions"><button class="cancel" id="cancel">再看看其他圖</button><button class="confirm" id="confirm">確認選這張</button></div></div></div><script>
const scenes=[{id:1,text:'先君子嘗言，鄉先輩左忠毅公視學京畿。',src:'images/scene1.png'},{id:2,text:'一日，風雪嚴寒，從數騎出，微行，入古寺。',src:'images/scene2.png'},{id:3,text:'廡下一生伏案臥，文方成草。',src:'images/scene3.png'},{id:4,text:'公閱畢，即解貂覆生，為掩戶。',src:'images/scene4.png'}];
const $=s=>document.querySelector(s);let index=0,score=0,soundOn=true,order=[],picked=null,busy=false,audioCtx=null;function shuffle(items){let a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function play(){if(!soundOn)return;try{const ctx=audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();[523,659,784].forEach((f,i)=>{const t=ctx.currentTime+i*.12,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}
function render(){if(index>=scenes.length){finish();return}const s=scenes[index];$('#progressLabel').textContent=`第 ${index+1} / ${scenes.length} 句`;$('#score').textContent=`得分 ${score}`;$('#progressFill').style.width=`${index/scenes.length*100}%`;$('#sentence').textContent=s.text;$('#target').innerHTML='<span class="plus">＋</span><span>選擇下方插畫填入</span>';$('#target').className='target';$('#remaining').textContent=`剩餘 ${order.length} 張`;$('#choices').innerHTML='';order.forEach(id=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-label','放大查看候選圖片');const im=document.createElement('img');im.src=scenes[id-1].src;im.alt='候選插畫';b.appendChild(im);b.addEventListener('click',()=>openPreview(id));$('#choices').appendChild(b)})}
function openPreview(id){if(busy)return;picked=id;$('#preview').src=scenes[id-1].src;$('#overlay').classList.add('show');$('#confirm').focus()}function closePreview(){$('#overlay').classList.remove('show');picked=null}function message(s,ok){$('#feedback').textContent=s;$('#feedback').className='feedback '+(ok?'good':'bad')}function answer(){if(picked===null||busy)return;const id=picked;closePreview();if(id!==scenes[index].id){message('這張插畫與原文情節不符，再觀察看看！',false);return}busy=true;play();score+=100;order=order.filter(n=>n!==id);$('#target').innerHTML=`<img src="${scenes[index].src}" alt="配對成功的插畫">`;$('#target').className='target filled';message('✓ 答對了！準備進入下一句……',true);$('#score').textContent=`得分 ${score}`;$('#progressFill').style.width=`${(index+1)/scenes.length*100}%`;setTimeout(()=>{index++;busy=false;message('',true);render()},1050)}function finish(){$('#game').style.display='none';$('#review').classList.add('show');$('#reviewGrid').innerHTML=scenes.map(s=>`<article class="review-item"><img src="${s.src}" alt="第${s.id}句插畫"><small>第 ${s.id} 句</small><p>${s.text}</p></article>`).join('');window.scrollTo({top:0,behavior:'smooth'})}function reset(){index=0;score=0;picked=null;busy=false;order=shuffle(scenes.map(s=>s.id));$('#game').style.display='block';$('#review').classList.remove('show');closePreview();message('',true);render();window.scrollTo({top:0,behavior:'smooth'})}$('#confirm').addEventListener('click',answer);$('#cancel').addEventListener('click',closePreview);$('#close').addEventListener('click',closePreview);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});$('#reset').addEventListener('click',reset);$('#again').addEventListener('click',reset);$('#sound').addEventListener('click',()=>{soundOn=!soundOn;$('#sound').textContent='音效：'+(soundOn?'開':'關')});reset();
</script></body></html>
